name: M0 quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.15.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting, lint, types, tests, builds and preview isolation
        run: pnpm check
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - name: Expo dependency compatibility
        run: pnpm expo:check
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_USER: typeduel_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: typeduel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typeduel_test -d typeduel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://typeduel_test:disposable_ci_password@127.0.0.1:5432/typeduel_test
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.15.0
      - name: Install locked dependencies under workspace security policy
        run: pnpm install --frozen-lockfile
      - name: Real PostgreSQL durability, ordering, ownership and recovery tests
        run: pnpm test:integration
